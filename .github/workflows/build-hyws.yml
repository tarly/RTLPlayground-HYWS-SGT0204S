name: Build HYWS-SGT0204S

on:
  push:
    paths:
      - "machine/HYWS-SGT0204S.*"
      - "config/**"
      - ".github/workflows/build-hyws.yml"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: debian:trixie
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            make gcc g++ pkg-config bison flex libboost-dev patch \
            bzip2 curl ca-certificates xxd python3 libjson-c-dev zlib1g-dev git
      - name: Build firmware
        run: |
          make CI=1 MACHINE=HYWS-SGT0204S \
            CONFIG=config/default.txt VERSION=0.2.10_LEDBROKE \
            OUTPUT_DIR=dist OUTPUT_NAME=HYWS-SGT0204S-V0.2.10_LEDBROKE.bin
      - name: Verify 512 KB
        run: |
          test -f dist/HYWS-SGT0204S-V0.2.10_LEDBROKE.bin
          test "$(stat -c%s dist/HYWS-SGT0204S-V0.2.10_LEDBROKE.bin)" -eq 524288
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: HYWS-SGT0204S-V0.2.10_LEDBROKE
          path: dist/HYWS-SGT0204S-V0.2.10_LEDBROKE.bin
          if-no-files-found: error